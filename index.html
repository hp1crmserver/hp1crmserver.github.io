<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboards | HP1CRM</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2.5rem 1rem;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      font-size: 1.75rem;
    }
    .grid {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    a.card {
      display: block;
      padding: 1.25rem;
      border-radius: 10px;
      background: #1e293b;
      color: inherit;
      text-decoration: none;
      border: 1px solid #334155;
    }
    a.card:hover {
      border-color: #38bdf8;
    }
    .title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }
    .desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
    }
    .url {
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dashboards Disponibles</h1>
    <p>Selecciona un proyecto para abrir su panel:</p>
    <div id="repos-grid" class="grid">Cargando repositorios...</div>
  </div>

  <script>
    // Cambia a "https://api.github.com/orgs/NOMBRE_ORG/repos?per_page=100" si es una organización
    const API_URL = "https://api.github.com/users/hp1crmserver/repos?per_page=100&sort=updated";
    const ROOT_REPO = "hp1crmserver.github.io";

    async function cargarRepositorios() {
      const grid = document.getElementById("repos-grid");
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("No se pudo consultar la API de GitHub");
        const repos = await res.json();

        // Filtra el repo raíz, forks y archivados (y opcionalmente repos sin Pages si has_pages es false)
        const filtrados = repos.filter(repo =>
          repo.name.toLowerCase() !== ROOT_REPO.toLowerCase() &&
          !repo.fork &&
          !repo.archived
        );

        if (filtrados.length === 0) {
          grid.innerHTML = "<p>No hay repositorios secundarios disponibles.</p>";
          return;
        }

        grid.innerHTML = "";
        filtrados.forEach(repo => {
          const card = document.createElement("a");
          card.className = "card";
          card.href = `./${repo.name}/`;
          card.innerHTML = `
            <div class="title">${repo.name}</div>
            ${repo.description ? `<div class="desc">${repo.description}</div>` : ""}
            <div class="url">dashboards.hp1crm.org/${repo.name}/</div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = `<p>Error al cargar repositorios: ${err.message}</p>`;
      }
    }

    cargarRepositorios();
  </script>
</body>
</html>
